[project]
name = "semilla-flet"
version = "0.1.0"
description = "Semilla — No gestionas tareas. Cultivas tu día."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Semilla Dev", email = "dev@semilla.app" }
]
dependencies = [
    "flet>=0.21.0",
    "Pillow>=10.0.0",
    "plyer>=2.1.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "."

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyrefly]
search_path = ["."]
project_root = "."

[tool.flet]
org = "app.semilla"
product = "Semilla"
company = "Semilla"
copyright = "Copyright (C) 2024 Semilla"
